name: ci-matrix-scan

# 全 ippoan / ohishi-exp / yhonda-ohishi 配下の repo の `.github/workflows/*.yml`
# を walk し、reusable workflow 採用状況を `data/ci-matrix.json` に commit-back
# する。`/ci-matrix` ページがこの JSON を `raw.githubusercontent.com` 経由で
# fetch する (Refs ippoan/ci-dashboard#377).

on:
  schedule:
    - cron: '0 */6 * * *'   # 6 時間ごと
  workflow_dispatch:

permissions:
  contents: write   # data/ci-matrix.json を main に commit

concurrency:
  group: ci-matrix-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yaml parser
        run: pip install --quiet 'pyyaml>=6.0'

      - name: Mint GitHub App token (org-wide read)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ippoan
          # ohishi-exp / yhonda-ohishi の repo も含めるため、App が
          # install されている全 org を列挙する。caller_repo_owner 以外の
          # org にもアクセスするには installation を切り替える必要が
          # あるが、actions/create-github-app-token は v2 で複数 owner 未対応
          # のため、ippoan を主に取り、別 org は contents/metadata read
          # 権限が同 App に乗っていれば直接 GET できる。

      - name: Scan
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_ORGS: 'ippoan,ohishi-exp,yhonda-ohishi'
        run: python scripts/ci-matrix-scan.py

      - name: Commit back
        env:
          # CI_APP の token で push (GITHUB_TOKEN だと branch protection
          # を満たせない repo もあるため統一)。push 自体は CI を走らせない
          # よう [skip ci] でガード。
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          git config user.name 'ci-dashboard-bot[bot]'
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ci-matrix.json; then
            echo "no changes to data/ci-matrix.json"
            exit 0
          fi
          git add data/ci-matrix.json
          git commit -m 'chore(ci-matrix): refresh scan [skip ci]' \
                     -m 'Generated by .github/workflows/ci-matrix-scan.yml' \
                     -m 'Refs #377'
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" HEAD:main
